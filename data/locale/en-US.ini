Groovalizer="Groovalizer (Music Visualizer)"

AudioSource="Audio Source"
AudioSource.Desc="Which OBS audio source drives the visuals. Pick your Desktop Audio to react to whatever is playing, or a mic/instrument input for live performance. Leave as None and the scene animates on its own clock."
None="(None — idle animation)"

Scene="Scene"
Theme="Colour Theme"
ColorA="Colour 1"
ColorB="Colour 2"
ColorC="Colour 3"
Intensity="Intensity"

Reactivity="Reactivity"
Speed="Speed"
BeatSensitivity="Beat Sensitivity"
AutoGain="Auto Level"
AutoGain.Desc="Continuously normalises quiet and loud tracks to the same visual range. Turn off if you are riding the fader yourself and want the visuals to follow it."

FreqLo="Frequency From"
FreqHi="Frequency To"
FreqRange.Desc="Which part of the spectrum drives the visuals, as a percentage of the 30 Hz - 16 kHz range. Narrow it toward the left for a bass-only look; leave it wide for the full spectrum."

HueShift="Hue Shift"
Saturation="Saturation"
Brightness="Brightness"
Contrast="Contrast"
Trail="Trails"
Vignette="Vignette"
BloomEnabled="Bloom"
Bloom="Bloom Amount"

Width="Width"
Height="Height"
Quality="Detail"
Quality.Desc="Noise octaves. 3 is cheapest, 6 is the most detailed. Drop this first if the visualizer costs too much render time."

Opacity="Opacity"
TransparentBg="Transparent Background"
TransparentBg.Desc="Turns the black the visuals sit on into real transparency, so this can be layered over gameplay or a camera instead of covering it. For the brightest result set the source's Blending Mode to Additive or Screen (right-click the source > Blending Mode)."
AlphaGain="Edge Softness"
AlphaGain.Desc="How quickly dim areas become fully opaque when Transparent Background is on. Low values keep only the brightest cores and give a delicate overlay; high values make more of the scene solid."

AlphaFloor="Black Point"
AlphaFloor.Desc="Raise this until the faint haze over your background disappears. Most scenes keep a low ambient glow so quiet passages fade to embers instead of nothing — good full-screen, but it stops anything keying fully transparent."
OverlayPreset="Optimise for Overlay"

Exposure="Exposure"
Exposure.Desc="The control that actually makes an overlay bright. Scenes render in high dynamic range with plenty of headroom above white; this decides how much of that lands in the visible range. Brightness below only lifts what survived the tone map, so it washes out rather than brightening. Start around 3 for overlay use."

UseMilk="Use MilkDrop presets"
UseMilk.Desc="Renders .milk presets through libprojectM instead of the built-in scenes. Requires OBS's OpenGL renderer, which is the default on macOS and Linux; on Windows OBS uses Direct3D 11 and this will report that it cannot start."
MilkDir="Preset folder"
MilkDir.Desc="A folder of .milk files. Scanned recursively. Only Groovalizer's own presets ship with the plugin — point this at your own collection to use it."
MilkPreset="Preset"
MilkPreset.Empty="(enable MilkDrop and reopen this window)"

