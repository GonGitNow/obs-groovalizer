# What this proves, and what it does not.
#
# The MilkDrop backend's Windows path (src/groove-gl-bridge-win.cpp) creates a
# WGL context and shares a texture with OBS's D3D11 device. It was written on a
# Mac and has never rendered a frame. This workflow exists so that at least the
# compiler sees it on every push, because the alternative is finding out from a
# user.
#
# These jobs verify COMPILATION. Green here does not mean the plugin loads,
# renders, or cleans up after itself. Before any release someone must run it in
# a real OBS on Windows — see the checklist in README.md.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_branch:
        description: >-
          Also commit the finished macOS packages to this branch. For
          environments that can reach github.com over git but not the storage
          host Actions artifacts are served from.
        required: false
        default: ''

env:
  # Must match the OBS you target: libobs struct layouts are not stable across
  # majors, and a mismatch crashes on plugin load rather than failing to build.
  OBS_TAG: '32.1.2'

jobs:
  compile:
    name: compile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Check out libobs headers
        uses: actions/checkout@v4
        with:
          repository: obsproject/obs-studio
          ref: ${{ env.OBS_TAG }}
          path: .deps/obs-studio
          submodules: false
          fetch-depth: 1

      # Headers only. libprojectM itself is not built: this job type does not
      # link, and building it on three platforms would turn a two-minute check
      # into a twenty-minute one.
      - name: Check out libprojectM headers
        uses: actions/checkout@v4
        with:
          repository: projectM-visualizer/projectm
          ref: master
          path: .deps/projectm
          submodules: false
          fetch-depth: 1

      # Both are generated by libprojectM's own CMake run, which we skip.
      - name: Stub libprojectM generated headers
        shell: bash
        run: |
          inc=.deps/projectm/src/api/include/projectM-4
          cat > "$inc/projectM_export.h" <<'EOF'
          #ifndef PROJECTM_EXPORT_H
          #define PROJECTM_EXPORT_H
          #define PROJECTM_EXPORT
          #define PROJECTM_NO_EXPORT
          #define PROJECTM_DEPRECATED
          #define PROJECTM_DEPRECATED_EXPORT
          #define PROJECTM_DEPRECATED_NO_EXPORT
          #endif
          EOF
          sed -e 's/@PROJECTM_VERSION_MAJOR@/4/g' \
              -e 's/@PROJECTM_VERSION_MINOR@/1/g' \
              -e 's/@PROJECTM_VERSION_PATCH@/4/g' \
              -e 's/@[A-Za-z_]*@/0/g' \
              .deps/projectm/src/api/version.h.in > "$inc/version.h"

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libsimde-dev

      - name: Install macOS dependencies
        if: matrix.os == 'macos-latest'
        run: brew install simde

      - name: Configure
        shell: bash
        env:
          OBS_SOURCE_DIR: ${{ github.workspace }}/.deps/obs-studio
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DGROOVE_COMPILE_ONLY=ON \
            -DENABLE_MILKDROP=ON \
            -DPROJECTM_INCLUDE_DIR="${{ github.workspace }}/.deps/projectm/src/api/include"

      - name: Compile
        run: cmake --build build --config Release

  # ── Distributable macOS packages ──────────────────────────────────────────
  # The compile matrix above proves the code compiles. These jobs produce the
  # thing you actually hand to someone: a complete obs-groovalizer.plugin with
  # its shaders, locale and presets inside, zipped with the preset pack and
  # docs/SETUP-macOS.md by scripts/package-macos.sh.
  #
  #   scenes    the generated scenes only, no libprojectM. Small.
  #   milkdrop  adds the .milk backend. libprojectM is built from master here
  #             (every tagged release lacks projectm_opengl_render_frame_fbo —
  #             see CMakeLists.txt) and bundled into Contents/Frameworks, so the
  #             recipient installs one folder and nothing else.
  #
  # Both are universal (arm64 + x86_64) and ad-hoc signed. Not notarised: the
  # recipient clears the quarantine flag once, which the guide covers. A real
  # Developer ID signature would slot in after the Package step.
  package-macos:
    name: package (macOS, ${{ matrix.variant }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [scenes, milkdrop]
    env:
      OBS_SOURCE_DIR: ${{ github.workspace }}/.deps/obs-studio
      PM_PREFIX: ${{ github.workspace }}/.deps/projectm-install
      ARCHS: 'arm64;x86_64'
      # Oldest macOS the package will load on. Older than anything OBS 32 runs
      # on, so it never becomes the limiting factor.
      MIN_MACOS: '12.0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: obsproject/obs-studio
          ref: ${{ env.OBS_TAG }}
          path: .deps/obs-studio
          submodules: false
          fetch-depth: 1

      - run: brew install simde

      - name: Check out libprojectM
        if: matrix.variant == 'milkdrop'
        uses: actions/checkout@v4
        with:
          repository: projectM-visualizer/projectm
          ref: master
          path: .deps/projectm
          submodules: recursive
          fetch-depth: 1

      - name: Build libprojectM
        if: matrix.variant == 'milkdrop'
        run: |
          cmake -S .deps/projectm -B .deps/projectm/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PM_PREFIX" \
            -DCMAKE_OSX_ARCHITECTURES="$ARCHS" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MIN_MACOS" \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=OFF \
            -DENABLE_PLAYLIST=OFF \
            -DENABLE_SDL_UI=OFF
          cmake --build .deps/projectm/build --config Release --parallel "$(sysctl -n hw.ncpu)"
          cmake --install .deps/projectm/build

      - name: Configure and build
        run: |
          if [ "${{ matrix.variant }}" = milkdrop ]; then milk=ON; else milk=OFF; fi
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="$ARCHS" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MIN_MACOS" \
            -DENABLE_MILKDROP=$milk \
            -DCMAKE_PREFIX_PATH="$PM_PREFIX"
          cmake --build build --config Release --parallel "$(sysctl -n hw.ncpu)"

      - name: Package
        run: scripts/package-macos.sh build ${{ matrix.variant }} dist "$PM_PREFIX"

      - uses: actions/upload-artifact@v4
        with:
          name: obs-groovalizer-macos-${{ matrix.variant }}
          path: dist/*.zip
          if-no-files-found: error

  # Manual runs can also drop the packages on a branch, as plain files in an
  # orphan commit. Artifacts live on a storage host that some networks cannot
  # reach; a git fetch of github.com almost always works. Force-pushed, so the
  # branch only ever holds the latest run's packages.
  publish-branch:
    name: publish packages to a branch
    needs: package-macos
    if: github.event_name == 'workflow_dispatch' && inputs.publish_branch != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: obs-groovalizer-macos-*
          merge-multiple: true
          path: dist

      - name: Commit the packages to the branch
        env:
          BRANCH: ${{ inputs.publish_branch }}
        run: |
          git checkout --orphan "$BRANCH"
          git rm -rfq .
          cp dist/*.zip .
          git add ./*.zip
          git -c user.name=github-actions -c user.email=github-actions@github.com \
            commit -q -m "macOS packages built from $GITHUB_SHA"
          git push --force origin "HEAD:refs/heads/$BRANCH"
          echo "pushed $(ls *.zip | tr '\n' ' ') to $BRANCH"

  # A v* tag turns both packages into a GitHub release.
  release:
    name: release
    needs: package-macos
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: obs-groovalizer-macos-*
          merge-multiple: true
          path: dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "Groovalizer $tag" --generate-notes
          fi
          gh release upload "$tag" dist/*.zip --repo "$GITHUB_REPOSITORY" --clobber
